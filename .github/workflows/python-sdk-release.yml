name: Python SDK Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

defaults:
  run:
    working-directory: packages/python-sdk

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Compute next version
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump }}
        run: |
          LATEST_TAG=$(git tag -l 'python-sdk-v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            NEW_VERSION="$CURRENT"
          else
            CURRENT="${LATEST_TAG#python-sdk-v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP_TYPE" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=python-sdk-v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate prepared release source
        id: source
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          SOURCE_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          MODULE_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/mangrove_markets/_version.py)
          echo "Expected release: ${NEW_VERSION}; source: ${SOURCE_VERSION}; module: ${MODULE_VERSION}"
          [ "$SOURCE_VERSION" = "$NEW_VERSION" ] || exit 1
          [ "$MODULE_VERSION" = "$NEW_VERSION" ] || exit 1
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || exit 1
          if [ -n "$(git status --porcelain)" ]; then
            echo "Release source tree must be clean before building" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Verify version
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          BUILT=$(unzip -p dist/*.whl '*/METADATA' | grep '^Version:' | cut -d' ' -f2)
          SDIST_BUILT=$(tar -xOf dist/*.tar.gz --wildcards '*/PKG-INFO' | grep '^Version:' | cut -d' ' -f2)
          echo "Expected: ${EXPECTED}, wheel: ${BUILT}, sdist: ${SDIST_BUILT}"
          [ "$BUILT" = "$EXPECTED" ] || exit 1
          [ "$SDIST_BUILT" = "$EXPECTED" ] || exit 1

          SOURCE_VERSION=$(git show HEAD:packages/python-sdk/pyproject.toml | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/')
          MODULE_VERSION=$(git show HEAD:packages/python-sdk/src/mangrove_markets/_version.py | sed -n 's/^__version__ = "\(.*\)"/\1/p')
          echo "Tagged source versions: pyproject=${SOURCE_VERSION}, module=${MODULE_VERSION}"
          [ "$SOURCE_VERSION" = "$EXPECTED" ] || exit 1
          [ "$MODULE_VERSION" = "$EXPECTED" ] || exit 1

          INSTALL_DIR=$(mktemp -d)
          python -m pip install --no-deps --target "$INSTALL_DIR" dist/*.whl
          INSTALLED=$(PYTHONPATH="$INSTALL_DIR" python -c 'import mangrove_markets; print(mangrove_markets.__version__)')
          echo "Installed module version: ${INSTALLED}"
          [ "$INSTALLED" = "$EXPECTED" ] || exit 1

      - name: Tag release after artifact validation
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo "Release source changed after artifact build" >&2
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Release source tree changed after artifact build" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION_TAG}" >/dev/null; then
            echo "Tag ${VERSION_TAG} already exists" >&2
            exit 1
          fi
          git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG"
          echo "Tagging source commit $(git rev-parse HEAD)"
          # The release version is already committed by a reviewed source PR.
          # Tag the exact clean commit from which these artifacts were built.
          git push origin "$VERSION_TAG"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/python-sdk/dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: mangrovemarkets ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## mangrovemarkets ${{ steps.version.outputs.version }}

            ```bash
            pip install mangrovemarkets==${{ steps.version.outputs.version }}
            ```
