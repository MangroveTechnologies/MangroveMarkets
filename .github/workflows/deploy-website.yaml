name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'packages/website/**'
      - 'firebase.json'
  workflow_dispatch:

# Public resource identifiers, not credentials. The existing WIF member must
# independently authorize this repository's exact main-branch OIDC subject.
env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/483282138591/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_SERVICE_ACCOUNT_EMAIL: github-actions-deployer@mangrove-markets.iam.gserviceaccount.com

jobs:
  deploy:
    if: >-
      github.repository == 'MangroveTechnologies/MangroveMarkets' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter @mangrove-ai/website build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project mangrove-markets
