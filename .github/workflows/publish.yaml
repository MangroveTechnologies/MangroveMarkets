name: Publish SDK
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'packages/sdk/package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile

      # Anonymous registry metadata: only 404 proves this exact version is absent.
      - name: Check exact Markets version on npm
        id: check
        run: node scripts/check-npm-release.mjs

      - if: steps.check.outputs.exists == 'false'
        run: pnpm --filter @mangrove-ai/sdk lint
      - if: steps.check.outputs.exists == 'false'
        run: pnpm --filter @mangrove-ai/sdk test -- --run
      - if: steps.check.outputs.exists == 'false'
        run: pnpm --filter @mangrove-ai/sdk build
      - name: Verify npm publishing authentication
        if: steps.check.outputs.exists == 'false'
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing npm publishing credential."
            exit 1
          fi
          if ! npm whoami --registry=https://registry.npmjs.org --loglevel=silent --logs-max=0 >/dev/null 2>&1; then
            echo "::error::npm authentication check failed."
            exit 1
          fi
          echo "npm authentication checked; package publish authority is verified by publication."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: steps.check.outputs.exists == 'false'
        run: cd packages/sdk && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.check.outputs.exists == 'true'
        run: echo "Version ${{ steps.check.outputs.version }} already published, skipping."
