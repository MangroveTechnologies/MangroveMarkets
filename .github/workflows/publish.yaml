name: Publish SDK
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'packages/sdk/package.json'

jobs:
  publish:
    # Only the native main push publishes; historical GitHub release events are inert.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: markets-typescript-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile

      # Anonymous registry metadata: only 404 proves this exact version is absent.
      - name: Check exact Markets version on npm
        id: check
        run: node scripts/check-npm-release.mjs

      - name: Verify native main release source or immutable published-source recovery
        run: node scripts/complete-npm-release.mjs preflight "${{ steps.check.outputs.exists }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - run: pnpm --filter @mangrove-ai/markets lint
      - run: pnpm --filter @mangrove-ai/markets test -- --run
      - run: pnpm --filter @mangrove-ai/markets build
      - name: Pack the exact reviewed build once
        run: npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/markets-pack.json"
        working-directory: packages/sdk

      - name: Verify npm publishing authentication
        if: steps.check.outputs.exists == 'false'
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing npm publishing credential."
            exit 1
          fi
          if ! npm whoami --registry=https://registry.npmjs.org --loglevel=silent --logs-max=0 >/dev/null 2>&1; then
            echo "::error::npm authentication check failed."
            exit 1
          fi
          echo "npm authentication checked; package publish authority is verified by publication."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Recheck native main immediately before publication
        if: steps.check.outputs.exists == 'false'
        run: node scripts/complete-npm-release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.check.outputs.exists == 'false'
        run: npm publish --ignore-scripts --provenance --access public
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry archive and complete the exact tagged release
        run: node scripts/complete-npm-release.mjs complete "$RUNNER_TEMP/markets-pack.json"
        env:
          GH_TOKEN: ${{ github.token }}
